name: Subdomain Scanner Cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  
concurrency:
  group: scanner-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Run Harvester
        run: python harvester.py
        continue-on-error: true
        
      - name: Run Resolver
        run: python resolver.py
        continue-on-error: true
        
      - name: Run Validator
        run: python validator.py
        continue-on-error: true
        
      - name: Run Deployer
        run: python deployer.py
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_ORG_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
          GA4_ID: ${{ secrets.GA4_ID }}
          AD_POPUNDER: ${{ secrets.AD_POPUNDER }}
          AD_NATIVE: ${{ secrets.AD_NATIVE }}
          MONERO_WALLET: ${{ secrets.MONERO_WALLET }}
        continue-on-error: true
        
      - name: Run Janitor
        run: python janitor.py
        continue-on-error: true


      - name: Save Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add harvested.db
          git commit -m "Auto-update: Scanned DB" || echo "No changes to commit"
          git push
